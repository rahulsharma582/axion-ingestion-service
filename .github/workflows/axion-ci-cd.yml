name: Axion CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/axion-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # =========================================================
  # 1. COMPILE / TEST
  # =========================================================
  compile:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile / Syntax Check
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest
          else
            echo "No tests directory found - skipping tests"
          fi


  # =========================================================
  # 2. SCA
  # =========================================================
  sca:
    name: SCA Scan
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run SCA scan
        run: |
          pip-audit -r requirements.txt


  # =========================================================
  # 3. PLAN
  # =========================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: sca

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes manifests..."

          test -f axion-backend-deployment.yaml
          test -f axion-backend-service.yaml

          echo "Deployment manifest found:"
          cat axion-backend-deployment.yaml

          echo "Service manifest found:"
          cat axion-backend-service.yaml


  # =========================================================
  # 4. BUILD + TRIVY + GHCR
  # =========================================================
  build:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: plan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # =========================================================
  # 5. DEPLOY TO AKS
  # =========================================================
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group rg-aks-preprod --name aks-preprod --overwrite-existing

      - name: Update backend image
        run: |
          kubectl -n preprodns set image deployment/axion-backend axion-backend=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Wait for rollout
        run: |
          kubectl -n preprodns rollout status deployment/axion-backend --timeout=180s

      - name: Verify backend pods
        run: |
          kubectl get pods -n preprodns -l app=axion-backend

      - name: Verify backend service
        run: |
          kubectl get svc axion-backend-service -n preprodns