name: Axion CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile / Syntax Check
        run: python -m compileall .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found - skipping tests"
          fi
  sca:
    name: SCA Scan
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: sca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show deployment manifests
        run: |
          echo "Validating Kubernetes manifests..."
          cat axion-backend-deployment.yaml
          cat axion-backend-service.yaml
  build:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t axion-backend:${{ github.sha }} .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: axion-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1