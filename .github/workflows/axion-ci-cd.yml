name: Axion CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile / Syntax Check
        run: python -m compileall .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found - skipping tests"
          fi
  sca:
    name: SCA Scan
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: sca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show deployment manifests
        run: |
          echo "Validating Kubernetes manifests..."
          cat axion-backend-deployment.yaml
          cat axion-backend-service.yaml
  build:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t axion-backend:${{ github.sha }} .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: axion-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          docker tag axion-backend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/axion-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/axion-backend:${{ github.sha }}

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-aks-preprod \
            --name aks-preprod \
            --overwrite-existing

      - name: Update image
        run: |
          kubectl -n preprodns set image deployment/axion-backend \
            axion-backend=ghcr.io/${{ github.repository_owner }}/axion-backend:${{ github.sha }}

      - name: Rollout status
        run: |
          kubectl -n preprodns rollout status deployment/axion-backend --timeout=180s

      - name: Verify pods
        run: |
          kubectl get pods -n preprodns -l app=axion-backend