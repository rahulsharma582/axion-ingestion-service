apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-backend
  namespace: preprodns

spec:
  replicas: 2

  selector:
    matchLabels:
      app: axion-backend

  template:
    metadata:
      labels:
        app: axion-backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: axion-backend
          image: ghcr.io/rahulsharma582/axion-backend:1.0

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: axion-db-secret
                  key: DATABASE_URL

          ports:
            - containerPort: 8000